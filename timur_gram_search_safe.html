<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timur-gram</title>
<style>
:root{
  --bg:#100b1d; --panel:#19112b; --card:#211638; --text:#fff;
  --muted:#a99fba; --accent:#8b3dff; --accent2:#b16cff; --border:#34264d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
.app{max-width:1050px;margin:auto;min-height:100vh;display:flex;background:var(--panel)}
.sidebar{width:330px;border-right:1px solid var(--border);padding:18px}
.brand{font-size:25px;font-weight:800;margin-bottom:18px}
.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:white;outline:none}
.chatlist{margin-top:15px}
.empty{text-align:center;color:var(--muted);padding:45px 15px}
.main{flex:1;display:flex;flex-direction:column;min-height:100vh}
.top{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.icon{border:0;background:var(--card);color:white;border-radius:12px;padding:10px 13px;cursor:pointer}
.content{flex:1;padding:30px;overflow:auto}
.welcome{max-width:520px;margin:60px auto;text-align:center}
.logo{font-size:54px;margin-bottom:10px}
.welcome h1{margin:0 0 10px}
.welcome p{color:var(--muted)}
.btn{border:0;background:var(--accent);color:white;padding:13px 20px;border-radius:14px;font-weight:700;cursor:pointer}
.settings{max-width:600px;margin:auto}
.settings h2{margin-top:0}
.section{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:15px 0}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{border:2px solid transparent;border-radius:14px;padding:14px;cursor:pointer;color:white;background:#302441}
.theme.active{border-color:var(--accent2)}
.swatch{width:34px;height:34px;border-radius:50%;margin-bottom:8px}
.back{display:none}
.chat{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;margin:5px 0}
.chat:hover{background:var(--card)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:800}
.chatname{font-weight:700}.chatlast{color:var(--muted);font-size:13px;margin-top:3px}
.creator-badge{font-weight:900;display:inline-block;margin-left:6px;
background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#0a84ff,#af52de,#ff2d55);
-webkit-background-clip:text;background-clip:text;color:transparent;
text-shadow:0 0 10px rgba(175,82,222,.25)}
.creator-star{font-size:.9em}
.profile-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:15px}
.profile-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}
.profile-name{font-weight:800}.profile-sub{color:var(--muted);font-size:13px;margin-top:3px}
.messages{display:flex;flex-direction:column;gap:10px;max-width:700px;margin:auto}
.msg{padding:10px 14px;border-radius:16px;background:var(--card);max-width:75%;align-self:flex-start}
.msg.me{background:var(--accent);align-self:flex-end}
.composer{display:flex;gap:8px;max-width:700px;margin:18px auto 0;width:100%}
.composer input{flex:1;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none}
@media(max-width:700px){
 .app{display:block}
 .sidebar{width:100%;border:0;min-height:100vh}
 .main{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .main{display:flex}
 .back{display:inline-block}
 .content{padding:20px}
 .themes{grid-template-columns:repeat(2,1fr)}
}

.bot-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#ec4899);font-size:12px;margin-right:5px}
.bot-label{color:#a78bfa;font-weight:800;font-size:.82em}

</style>

<style id="timur-bot-styles">
.bot-card{display:flex;align-items:center;gap:16px;margin-top:14px;padding:18px;border-radius:22px;background:rgba(35,22,57,.95);border:1px solid rgba(150,90,255,.35);color:#fff}
.bot-avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#7c3cff,#b86cff)}
.card-info{flex:1}.bot-card .name{font-size:20px;font-weight:800}.bot-card .subtitle{margin-top:5px;color:#b8adc9;font-size:15px}.bot-badge{font-size:11px;padding:3px 7px;border-radius:8px;background:#7c3cff;color:white;vertical-align:middle}.arrow{font-size:34px;color:#a98bff}
.bot-chat-overlay{position:fixed;inset:0;background:#100b1b;z-index:99999;display:none;flex-direction:column;color:white;font-family:inherit}
.bot-chat-head{padding:18px;display:flex;align-items:center;gap:14px;background:#1c1229;border-bottom:1px solid #352447}
.bot-chat-back{border:0;background:#302044;color:white;font-size:28px;border-radius:14px;width:46px;height:46px}
.bot-chat-title{font-weight:800;font-size:20px}.bot-chat-status{font-size:13px;color:#67e8a5;margin-top:2px}
.bot-messages{flex:1;padding:20px;overflow:auto}.bot-msg{max-width:78%;padding:12px 15px;border-radius:18px;background:#2a1b3d;margin:10px 0}.bot-msg.you{margin-left:auto;background:#7c3cff}
.bot-input{display:flex;gap:8px;padding:12px;background:#1c1229}.bot-input input{flex:1;border:0;border-radius:18px;padding:13px;background:#2a2037;color:white;font-size:16px}.bot-input button{border:0;border-radius:18px;background:#7c3cff;color:white;padding:0 18px;font-weight:700}
</style>


<style id="compact-screen">
/* Компактный мобильный интерфейс */
body{
  margin:0;
  min-height:100vh;
}
.layout, main, .app, .container{
  max-width:520px !important;
  margin-left:auto !important;
  margin-right:auto !important;
}
.card, .bot-card{
  padding:14px !important;
  margin-top:10px !important;
  border-radius:18px !important;
}
.bot-card{
  gap:12px !important;
}
.bot-avatar{
  width:48px !important;
  height:48px !important;
  font-size:24px !important;
}
.bot-card .name{
  font-size:17px !important;
}
.bot-card .subtitle{
  font-size:13px !important;
}
#timurBotOverlay{
  max-width:520px;
  margin:0 auto;
}
</style>


<style id="settings-fix">
.settings-btn{position:fixed;top:14px;right:14px;z-index:1000;border:0;border-radius:14px;padding:10px 13px;background:var(--accent,#7c3aed);color:white;font-size:20px;box-shadow:0 4px 16px #0003}
.settings-panel{position:fixed;inset:0;background:var(--bg,#100b1d);z-index:1001;overflow:auto;padding:58px 18px 24px}
.settings-box{max-width:520px;margin:auto;background:var(--panel,#19112b);border:1px solid var(--border,#34264d);border-radius:22px;padding:20px;color:var(--text,#fff)}
.settings-box h2{margin-top:0}.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.theme-choice{border:2px solid transparent;border-radius:14px;padding:12px;background:var(--card,#211638);color:inherit;text-align:left}.theme-choice.active{border-color:var(--accent2,#b16cff)}.theme-dot{width:28px;height:28px;border-radius:50%;margin-bottom:6px}.close-settings{border:0;background:var(--card,#211638);color:inherit;border-radius:12px;padding:10px 14px;margin-bottom:15px}
</style>


<style id="search-safety">
.user-search-wrap{display:flex;gap:8px;margin-top:12px}
.user-search{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);outline:none}
.search-results{margin-top:8px}
.result-user{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;background:var(--card);margin-top:6px}
.result-user button{margin-left:auto;border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:white}
.safe-photo{position:relative;overflow:hidden;border-radius:14px}
.safe-photo img{display:block;max-width:100%}
.safe-photo.sensitive img{filter:blur(28px)}
.sensitive-cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0008;color:#fff;font-weight:700}
.sensitive-cover button{margin-top:10px;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:white}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">✈️ Timur-gram</div>
    <input class="search" placeholder="Поиск">
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" style="flex:1" onclick="addFriend()">＋ Добавить друга</button>
    </div>
    <div class="profile-card">
      <div class="profile-avatar">L</div>
      <div>
        <div class="profile-name">@Linovaa63-sys <span class="creator-badge"><span class="creator-star">★</span> Создатель</span></div>
        <div class="profile-sub">Твой профиль • специальный префикс виден другим</div>
      </div>

<div class="card bot-card" id="timurBotCard" onclick="openBotChat()" style="cursor:pointer;">
  <div class="avatar bot-avatar">🤖</div>
  <div class="card-info">
    <div class="name">Timur Bot <span class="bot-badge">BOT</span></div>
    <div class="subtitle">Онлайн • нажми, чтобы начать чат</div>
  </div>
  <div class="arrow">›</div>
</div>

    </div>
    <div class="chatlist" id="chatlist">
  </div>
</div>
</div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon back" onclick="closeChat()">←</button>
      <strong id="title">Timur-gram</strong>
      <button class="icon" onclick="showSettings()">⚙️</button>
    </header>
    <section class="content" id="content">
      <div class="welcome">
        <div class="logo">✈️</div>
        <h1>Добро пожаловать в Timur-gram</h1>
        <p>Твои чаты, друзья и сообщения — в одном месте.</p>
        <button class="btn" onclick="showSettings()">Настройки</button>
      </div>
    </section>
  </main>
</div>

<script>
const themes={
 purple:{name:"Фиолетовая",bg:"#100b1d",panel:"#19112b",card:"#211638",text:"#fff",muted:"#a99fba",accent:"#8b3dff",accent2:"#b16cff",border:"#34264d"},
 dark:{name:"Тёмная",bg:"#08090c",panel:"#111318",card:"#1b1e25",text:"#fff",muted:"#9ca3af",accent:"#5865f2",accent2:"#7289ff",border:"#2b303a"},
 white:{name:"Белая",bg:"#eef0f4",panel:"#fff",card:"#f3f4f7",text:"#17181c",muted:"#6b7280",accent:"#6d35e8",accent2:"#8b5cf6",border:"#d9dce3"},
 red:{name:"Красная",bg:"#1b080a",panel:"#250d10",card:"#341317",text:"#fff",muted:"#c9a1a5",accent:"#e53945",accent2:"#ff6570",border:"#4b2025"},
 green:{name:"Зелёная",bg:"#07130d",panel:"#0e2117",card:"#14301f",text:"#fff",muted:"#9db7a5",accent:"#20a85a",accent2:"#44d47b",border:"#245035"},
 orange:{name:"Оранжевая",bg:"#170d05",panel:"#261507",card:"#35200d",text:"#fff",muted:"#c9aa8c",accent:"#f07b19",accent2:"#ff9c3d",border:"#553218"},
 blue:{name:"Синяя",bg:"#06101c",panel:"#0c1b2d",card:"#12263d",text:"#fff",muted:"#9db0c5",accent:"#2f80ed",accent2:"#62a5ff",border:"#214363"},
 pink:{name:"Розовая",bg:"#190912",panel:"#2a0e1d",card:"#3a1528",text:"#fff",muted:"#c9a1b5",accent:"#e83e8c",accent2:"#ff72b0",border:"#56233d"}
};
function applyTheme(key){
 const t=themes[key]||themes.purple;
 for(const k in t) if(k!=="name") document.documentElement.style.setProperty("--"+k,t[k]);
 localStorage.setItem("timur-theme",key);
 document.querySelectorAll(".theme").forEach(x=>x.classList.toggle("active",x.dataset.theme===key));
}
function showSettings(){
 document.getElementById("app").classList.add("chat-open");
 document.getElementById("title").textContent="Настройки";
 document.getElementById("content").innerHTML=`
 <div class="settings">
   <h2>⚙️ Настройки</h2>
   <div class="section">
    <h3>🎨 Тема оформления</h3>
    <p style="color:var(--muted)">Выбери цвет Timur-gram.</p>
    <div class="themes">
      ${Object.entries(themes).map(([k,t])=>`
       <button class="theme" data-theme="${k}" onclick="applyTheme('${k}')">
        <div class="swatch" style="background:${t.accent}"></div>${t.name}
       </button>`).join("")}
    </div>
   </div>
   <div class="section">
    <h3>🔒 Аккаунт</h3>
    <p style="color:var(--muted)">Здесь позже будут юзернейм, пароль и другие настройки профиля.</p>
   </div>
 </div>`;
 const current=localStorage.getItem("timur-theme")||"purple";
 applyTheme(current);
}
function closeChat(){
 document.getElementById("app").classList.remove("chat-open");
}

let friends = JSON.parse(localStorage.getItem("timur-friends") || "[]");
let currentFriend = null;
const CREATOR_USERNAME = "Linovaa63-sys";
const CREATOR_LABEL = "Создатель";

function saveFriends(){
  localStorage.setItem("timur-friends", JSON.stringify(friends));
}

function renderChats(){
  const list=document.getElementById("chatlist");
  if(!list) return;
  let bot=`<div class="bot-chat" onclick="openTimurBot()">
    <div class="avatar">🤖</div>
    <div><div class="chatname">Timur Bot <span class="bot-label">БОТ</span></div>
    <div class="chatlast">Напиши мне — я отвечу 😊</div></div>
  </div>`;
  let people=friends.map((f,i)=>`
    <div class="chat" onclick="openChat(${i})">
      <div class="avatar">${escapeHtml(f[0].toUpperCase())}</div>
      <div><div class="chatname">@${escapeHtml(f)}${f.toLowerCase()===CREATOR_USERNAME.toLowerCase() ? '<span class="creator-badge"><span class="creator-star">★</span> '+CREATOR_LABEL+'</span>' : ''}</div><div class="chatlast">Новый чат</div></div>
    </div>`).join("");
  list.innerHTML=bot+(people || '<div class="empty">Добавьте друзей, чтобы начать общение 💜</div>');
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addFriend(){
  const username = prompt("Введите юзернейм друга (например: Masha123):");
  if(username === null) return;
  const name = username.trim().replace(/^@/,"");
  if(!name) return alert("Юзернейм не может быть пустым.");
  if(friends.some(x=>x.toLowerCase()===name.toLowerCase()))
    return alert("Этот друг уже добавлен.");
  friends.push(name);
  saveFriends();
  renderChats();
  openChat(friends.length-1);
}

function openChat(index){
  currentFriend = friends[index];
  document.getElementById("app").classList.add("chat-open");
  document.getElementById("title").innerHTML = "@"+escapeHtml(currentFriend)+
  (currentFriend.toLowerCase()===CREATOR_USERNAME.toLowerCase()
   ? ' <span class="creator-badge"><span class="creator-star">★</span> '+CREATOR_LABEL+'</span>' : '');
  const key = "timur-messages-" + currentFriend.toLowerCase();
  const messages = JSON.parse(localStorage.getItem(key) || "[]");
  document.getElementById("content").innerHTML = `
    <div class="messages" id="messages">
      ${messages.length ? messages.map(m=>`<div class="msg ${m.me?'me':''}">${escapeHtml(m.text)}</div>`).join("") :
      '<div class="empty">Начните общение с @'+escapeHtml(currentFriend)+' 💜</div>'}
    </div>
    <div class="composer">
      <input id="messageInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn" onclick="sendMessage()">Отправить</button>
    </div>`;
}

function sendMessage(){
  const input=document.getElementById("messageInput");
  if(!input || !input.value.trim() || !currentFriend) return;
  const key="timur-messages-"+currentFriend.toLowerCase();
  const messages=JSON.parse(localStorage.getItem(key)||"[]");
  messages.push({text:input.value.trim(),me:true});
  localStorage.setItem(key,JSON.stringify(messages));
  openChat(friends.indexOf(currentFriend));
  setTimeout(()=>document.getElementById("messageInput")?.focus(),50);
}

const oldCloseChat = closeChat;
closeChat = function(){
  oldCloseChat();
  currentFriend=null;
  document.getElementById("title").textContent="Timur-gram";
  document.getElementById("content").innerHTML=`
    <div class="welcome">
      <div class="logo">✈️</div>
      <h1>Добро пожаловать в Timur-gram</h1>
      <p>Твои чаты, друзья и сообщения — в одном месте.</p>
      <button class="btn" onclick="showSettings()">Настройки</button>
    </div>`;
  renderChats();
};
renderChats();

applyTheme(localStorage.getItem("timur-theme")||"purple");

// Timur-gram built-in chat bot
const TIMUR_BOT = {
  name: "Timur Bot",
  avatar: "🤖",
  replies: [
    "Привет! 👋 Я бот Timur-gram. Чем помочь?",
    "Понял тебя! 😊 Расскажи подробнее.",
    "Интересно! Я могу поддержать разговор.",
    "Хорошо 👍 Что хочешь сделать в Timur-gram?",
    "Я здесь 🤖 Можешь написать мне любой вопрос."
  ]
};

function openTimurBot(){
  currentFriend="__timur_bot__";
  document.getElementById("app").classList.add("chat-open");
  document.getElementById("title").innerHTML='🤖 Timur Bot <span class="bot-label">БОТ</span>';
  const key="timur-bot-messages";
  const msgs=JSON.parse(localStorage.getItem(key)||"[]");
  document.getElementById("content").innerHTML=`
    <div class="messages" id="messages">
      ${msgs.length ? msgs.map(m=>`<div class="msg ${m.me?'me':''}">${escapeHtml(m.text)}</div>`).join("") :
      '<div class="empty">Привет! 👋 Я <b>Timur Bot</b>.<br>Напиши мне что-нибудь 😊</div>'}
    </div>
    <div class="composer">
      <input id="messageInput" placeholder="Написать боту..." onkeydown="if(event.key==='Enter'){sendToTimurBot(this.value);this.value=''}">
      <button class="btn" onclick="sendToTimurBot(document.getElementById('messageInput').value);document.getElementById('messageInput').value=''">Отправить</button>
    </div>`;
  setTimeout(()=>document.getElementById("messageInput")?.focus(),50);
}
function sendToTimurBot(text){
  const messages = document.querySelector("#messages, .messages");
  if (!messages || !text.trim()) return;
  const clean = text.trim();
  const key = "timur-bot-messages";
  const saved = JSON.parse(localStorage.getItem(key) || "[]");
  saved.push({text: clean, me: true});
  localStorage.setItem(key, JSON.stringify(saved));
  messages.insertAdjacentHTML("beforeend",
    `<div class="msg me">${escapeHtmlBot(clean)}</div>`
  );
  const lower = clean.toLowerCase();
  let reply = TIMUR_BOT.replies[Math.floor(Math.random()*TIMUR_BOT.replies.length)];
  if (lower.includes("привет")) reply = "Привет! 👋 Рад тебя видеть!";
  else if (lower.includes("как дела")) reply = "У меня всё отлично 🤖 А у тебя?";
  else if (lower.includes("создатель")) reply = "⭐ Создатель Timur-gram — @Linovaa63-sys";
  else if (lower.includes("спасибо")) reply = "Пожалуйста! 💜";
  setTimeout(() => {
    const saved2 = JSON.parse(localStorage.getItem(key) || "[]");
    saved2.push({text: reply, me: false});
    localStorage.setItem(key, JSON.stringify(saved2));
    messages.insertAdjacentHTML("beforeend",
      `<div class="msg">${reply}</div>`
    );
    messages.scrollTop = messages.scrollHeight;
  }, 500);
  messages.scrollTop = messages.scrollHeight;
}

function escapeHtmlBot(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

</script>

<script id="timur-bot-script">
function openBotChat(){
  let el=document.getElementById('timurBotOverlay');
  if(!el){
    el=document.createElement('div'); el.id='timurBotOverlay'; el.className='bot-chat-overlay';
    el.innerHTML=`<div class="bot-chat-head"><button class="bot-chat-back" onclick="closeBotChat()">‹</button><div><div class="bot-chat-title">🤖 Timur Bot</div><div class="bot-chat-status">онлайн</div></div></div><div class="bot-messages" id="botMessages"><div class="bot-msg">Привет! 👋 Я Timur Bot. Напиши мне что-нибудь!</div></div><div class="bot-input"><input id="botInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendBotMessage()"><button onclick="sendBotMessage()">Отправить</button></div>`;
    document.body.appendChild(el);
  }
  el.style.display='flex';
}
function closeBotChat(){const el=document.getElementById('timurBotOverlay');if(el)el.style.display='none'}
function sendBotMessage(){
 const inp=document.getElementById('botInput'), text=inp.value.trim(); if(!text)return;
 const box=document.getElementById('botMessages');
 box.innerHTML += `<div class="bot-msg you"></div>`; box.lastElementChild.textContent=text; inp.value='';
 setTimeout(()=>{box.innerHTML += `<div class="bot-msg">Я получил сообщение: «${text.replace(/</g,'&lt;')}» 😊</div>`;box.scrollTop=box.scrollHeight},400);
 box.scrollTop=box.scrollHeight;
}
</script>

<script id="search-safety-js">
function searchUsers(value){
  const box=document.getElementById("searchResults");
  if(!box)return;
  const q=value.trim().replace(/^@/,"").toLowerCase();
  if(!q){box.innerHTML="";return;}
  const all=[{u:"Linovaa63-sys",creator:true},...friends.map(u=>({u,creator:false}))];
  const seen=new Set(), matches=all.filter(x=>{
    const k=x.u.toLowerCase();
    if(seen.has(k)||!k.includes(q))return false;
    seen.add(k);return true;
  });
  box.innerHTML=matches.length ? matches.map(x=>`
    <div class="result-user">
      <div class="avatar">${escapeHtml(x.u[0].toUpperCase())}</div>
      <div><b>@${escapeHtml(x.u)}</b>${x.creator?'<span class="creator-badge">★ Создатель</span>':''}</div>
      <button onclick="addSearchFriend('${escapeHtml(x.u)}')">＋ Чат</button>
    </div>`).join("") : '<div class="empty">Пользователь не найден</div>';
}
function addSearchFriend(name){
  if(name.toLowerCase()===CREATOR_USERNAME.toLowerCase()){
    if(!friends.some(x=>x.toLowerCase()===name.toLowerCase())){friends.push(name);saveFriends();renderChats();}
    openChat(friends.findIndex(x=>x.toLowerCase()===name.toLowerCase()));
    return;
  }
  if(!friends.some(x=>x.toLowerCase()===name.toLowerCase())){friends.push(name);saveFriends();renderChats();}
  openChat(friends.findIndex(x=>x.toLowerCase()===name.toLowerCase()));
}
function makePhotoSafe(container, isSensitive){
  if(!container)return;
  if(!isSensitive)return;
  container.classList.add("sensitive");
  container.insertAdjacentHTML("beforeend",`<div class="sensitive-cover">🔞 Фотография скрыта<br><button onclick="this.parentElement.remove();this.closest('.safe-photo').classList.remove('sensitive')">Показать</button></div>`);
}
